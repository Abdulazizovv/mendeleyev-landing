# Production konfiguratsiya
# Tashqi (host) nginx 127.0.0.1:3010 ga reverse proxy qiladi va SSL ni o'zi hal qiladi.

services:

  # ── Lead API (Express + Telegram) ───────────────────────────────────────────
  mendeleyev_landing_api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: mendeleyev_landing_api
    restart: unless-stopped
    env_file:
      - .env.backend
    volumes:
      # Statistika (stats.json) qayta build/restartda yo'qolmasligi uchun
      - landing_data:/app/data
    # Tashqi port yo'q — faqat nginx orqali
    expose:
      - "3001"
    networks:
      - landing_net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Nginx (statik frontend + /api proxy, tashqariga ochiq yagona port) ──────
  mendeleyev_landing_nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        # VITE_* build vaqtida bundle ichiga yoziladi — o'zgarsa qayta build qiling.
        VITE_LEAD_API_URL: ${VITE_LEAD_API_URL:-/api/lead}
    container_name: mendeleyev_landing_nginx
    restart: unless-stopped
    ports:
      # Tashqi nginx shu portga proxy qiladi
      - "3010:80"
    depends_on:
      - mendeleyev_landing_api
    networks:
      - landing_net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80/nginx-health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 32M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  landing_net:
    driver: bridge

volumes:
  landing_data:
