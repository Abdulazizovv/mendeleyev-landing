server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker internal DNS — har so'rovda qayta resolve qiladi (konteyner qayta qurilganda ham ishlaydi)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Tashqi nginx dan keladigan real IP
    real_ip_header     X-Forwarded-For;
    set_real_ip_from   0.0.0.0/0;

    # Gzip
    gzip            on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied    any;
    gzip_vary       on;
    gzip_types
        text/plain text/css text/javascript text/xml
        application/javascript application/json application/xml
        font/truetype font/opentype image/svg+xml;

    # Xavfsizlik headerlari
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Lead API (Express) — faqat kerakli yo'llar
    location /api/ {
        set $api_upstream http://mendeleyev_landing_api:3001;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout    30s;
        proxy_connect_timeout 5s;
        client_max_body_size  64k;
    }

    # Vite hash'lagan fayllar — abadiy kesh
    location /assets/ {
        expires max;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # Rasmlar
    location /images/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # index.html keshlanmaydi — yangi deploy darhol ko'rinsin
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
